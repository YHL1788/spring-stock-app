<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16352f" />
    <title>SIP 暂时离线</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(180deg, #16352f, #203d36);
        color: #f8efd9;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      main { max-width: 28rem; }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 0; color: rgba(248, 239, 217, 0.76); line-height: 1.7; }
      button {
        margin-top: 22px;
        border: 0;
        border-radius: 999px;
        background: #e0bc76;
        color: #16352f;
        padding: 11px 18px;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>当前没有网络</h1>
      <p>SIP 不会在离线页面缓存或展示投资数据。恢复网络后即可重新连接。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
